{% extends "base.html" %}
{% load static %}
{% block content %}
<h2 class="fw-bold mb-4"><i class="fas fa-edit me-2" style="color:#0ea5e9;"></i>Edit Attendance</h2>
<div class="card card-custom">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Employee</label>
          <input type="text" class="form-control" value="{{ attendance.employee.employee.name }}" disabled>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Date</label>
          <input type="text" class="form-control" value="{{ attendance.date }}" disabled>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Status</label>
          {{ form.status }}
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Check-in Time</label>
          {{ form.check_in }}
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Check-out Time</label>
          {{ form.check_out }}
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'attendance_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
