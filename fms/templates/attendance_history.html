<!DOCTYPE html>
{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h5>Attendance History</h5>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr><th>Date</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr>
        </thead>
        <tbody>
        {% for a in attendances %}
          <tr>
            <td>{{ a.date }}</td>
            <td>{{ a.check_in|default:"--" }}</td>
            <td>{{ a.check_out|default:"--" }}</td>
            <td>
              <span class="badge bg-{% if a.status == 'Present' %}success{% else %}warning text-dark{% endif %}">{{ a.status }}</span>
            </td>
          </tr>
        {% empty %}
          <tr><td colspan="4" class="text-center text-muted py-4">No attendance records yet.</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
