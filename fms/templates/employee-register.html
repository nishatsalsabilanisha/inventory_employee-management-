{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card card-custom p-4">
      <div class="text-center mb-4">
        <i class="fas fa-user-tie fa-3x mb-2" style="color:#0ea5e9;"></i>
        <h4 class="fw-bold" style="color:#0f172a;">Employee Registration</h4>
      </div>
      <div class="alert alert-secondary text-center" role="alert">
        <i class="fas fa-info-circle me-2"></i>
        Employee accounts are created by the Admin. Please contact your administrator to get access.
      </div>
      <div class="text-center mt-3">
        <a href="{% url 'login_page' %}" class="text-decoration-none small fw-semibold" style="color:#0ea5e9;"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
