{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="card card-custom">
      <div class="card-header bg-transparent fw-bold">
        <i class="fas fa-user-tag me-2" style="color:#0ea5e9;"></i>
        Assign Department / Position - {{ profile.employee.name }} <span class="small text-muted">({{ profile.public_id }})</span>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label small fw-semibold">{{ field.label }}</label>
              {{ field }}
              {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Assignment</button>
            <a href="{% url 'employee_data' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
