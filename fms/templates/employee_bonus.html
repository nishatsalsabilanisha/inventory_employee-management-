{% extends "base.html" %}
{% load static %}
{% block content %}
<h2 class="fw-bold mb-4"><i class="fas fa-gift me-2" style="color:#0ea5e9;"></i>Employee Bonus</h2>
<div class="card card-custom">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Employee</label>
          <select name="employee" class="form-select" required>
            <option value="">-- Select --</option>
            {% for emp in employees %}
            <option value="{{ emp.sl }}">{{ emp.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Bonus Percentage</label>
          {{ form.percentage }}
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Calculate Bonus</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
