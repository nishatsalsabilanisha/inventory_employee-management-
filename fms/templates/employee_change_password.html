{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card card-custom p-4">
      <div class="text-center mb-4">
        <i class="fas fa-lock fa-3x mb-2" style="color:#0ea5e9;"></i>
        <h4 class="fw-bold" style="color:#0f172a;">Change Your Password</h4>
        <p class="small" style="color:#64748b;">You must change your password before continuing. Please set a new secure password.</p>
      </div>
      <form method="POST" autocomplete="off">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold" style="color:#334155;">Current Password</label>
          <input type="password" name="current_password" class="form-control" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold" style="color:#334155;">New Password</label>
          <input type="password" name="new_password" class="form-control" autocomplete="new-password" required>
          <small style="color:#64748b;">Min 8 chars: uppercase, lowercase, number &amp; special character</small>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold" style="color:#334155;">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Password</button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'login_page' %}" class="text-decoration-none small fw-semibold" style="color:#0ea5e9;"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
