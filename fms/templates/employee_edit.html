{% extends "base.html" %}
{% load static %}
{% block content %}
<h2 class="fw-bold mb-4"><i class="fas fa-user-edit me-2" style="color:#38bdf8;"></i>Edit Employee</h2>
<div class="card card-custom">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Name</label>
          <input type="text" name="name" class="form-control" value="{{ employee.name }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" value="{{ employee.email }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">New Password (leave blank to keep current)</label>
          <input type="password" name="password" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ employee.phone }}">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Gender</label>
          <select name="gender" class="form-select">
            <option value="Male" {% if employee.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if employee.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if employee.gender == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Salary (BDT)</label>
          <input type="number" name="salary" class="form-control" value="{{ employee.salary }}" min="0">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Position</label>
          <input type="text" name="position" class="form-control" value="{{ employee.position }}">
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Update Employee</button>
        <a href="{% url 'employee_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
