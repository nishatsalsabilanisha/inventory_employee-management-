{% extends "base.html" %}
{% load static %}
{% block content %}
<h2 class="fw-bold mb-4"><i class="fas fa-users me-2" style="color:#0ea5e9;"></i>Employee List</h2>
<div class="card card-custom">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <form class="d-flex gap-2" method="GET">
        <input type="text" name="q" class="form-control form-control-sm" placeholder="Search employees..." style="max-width:250px;" value="{{ request.GET.q }}">
        <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-search"></i></button>
      </form>
      <a href="{% url 'employee_add' %}" class="btn btn-sm btn-primary"><i class="fas fa-plus me-1"></i>Add Employee</a>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for emp in employees %}
          <tr>
            <td>{{ emp.sl }}</td>
            <td class="fw-semibold">{{ emp.name }}</td>
            <td>{{ emp.email }}</td>
            <td>{{ emp.phone }}</td>
            <td>
              <a href="{% url 'employee_edit' emp.sl %}" class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></a>
              <a href="{% url 'employee_delete' emp.sl %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')"><i class="fas fa-trash"></i></a>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="5" class="text-center text-muted py-4">No employees found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
