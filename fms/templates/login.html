{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card card-custom p-4">
      <div class="text-center mb-4">
        <i class="fas fa-user-tie fa-3x mb-2" style="color:#0ea5e9;"></i>
        <h4 class="fw-bold" style="color:#0f172a;">Employee Login</h4>
        <p class="small" style="color:#64748b;">Sign in to your account</p>
      </div>
      <form method="POST" action="{% url 'login_page' %}" autocomplete="new-password">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold" style="color:#334155;">Email Address</label>
          <input type="email" name="email" class="form-control" autocomplete="new-password" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold" style="color:#334155;">Password</label>
          <input type="password" name="password" class="form-control" autocomplete="new-password" placeholder="Enter your password" required>
        </div>
        <div class="text-end mb-3">
          <a href="{% url 'employee_password_reset' %}" class="text-decoration-none small fw-semibold" style="color:#0ea5e9;">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="text-center small mt-3 mb-0" style="color:#64748b;">
        Employee accounts are created by the Admin. Please contact your administrator for access.
      </p>
    </div>
  </div>
</div>
{% endblock %}
