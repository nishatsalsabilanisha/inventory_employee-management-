{% extends "base.html" %}
{% load static %}
{% block content %}
<h2 class="fw-bold mb-4"><i class="fas fa-edit me-2" style="color:#0ea5e9;"></i>Edit Office IP</h2>
<div class="card card-custom">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small fw-semibold">IP Address</label>
          {{ form.ip_address }}
          {% if form.ip_address.errors %}
            <div class="text-danger small">{{ form.ip_address.errors|striptags }}</div>
          {% endif %}
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Label (optional)</label>
          {{ form.label }}
        </div>
        <div class="col-md-6">
          <div class="form-check mt-4">
            {{ form.is_active }}
            <label class="form-check-label" for="id_is_active">Active</label>
          </div>
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'office_ip_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
