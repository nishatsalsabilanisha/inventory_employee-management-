{% extends "base.html" %}
{% load static %}
{% block content %}
<h2 class="fw-bold mb-4"><i class="fas fa-box me-2" style="color:#0ea5e9;"></i>Add Product</h2>
<div class="card card-custom">
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data" autocomplete="off">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Product Name *</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-semibold">Brand</label>
          <input type="text" name="brand" class="form-control" placeholder="e.g. Le Reve">
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-semibold">SKU</label>
          <input type="text" name="sku" class="form-control" placeholder="e.g. SKD-001">
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Price (৳) *</label>
          <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Discount Price (৳)</label>
          <input type="number" step="0.01" name="discount_price" class="form-control" placeholder="optional">
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Stock Quantity</label>
          <input type="number" name="stock" class="form-control" value="0" min="0">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Category</label>
          <select name="category" class="form-select">
            <option value="Menswear">Men</option>
            <option value="Womenswear" selected>Women</option>
            <option value="Kids">Kids</option>
            <option value="Activewear">Activewear</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Subcategory</label>
          <select name="subcategory" class="form-select">
            <optgroup label="Men">
              <option value="Jeans">Jeans</option>
              <option value="Shirt">Shirt</option>
              <option value="Men Shoes">Men Shoes</option>
              <option value="T-Shirts">T-Shirts</option>
              <option value="Pants">Pants</option>
              <option value="Jackets">Jackets</option>
            </optgroup>
            <optgroup label="Women">
              <option value="Tops">Tops</option>
              <option value="Kamiz">Kamiz</option>
              <option value="Salwar Kameez" selected>Salwar Kameez</option>
              <option value="Kurti">Kurti</option>
              <option value="Dupatta">Dupatta</option>
              <option value="Women Shoes">Women Shoes</option>
              <option value="Dresses">Dresses</option>
              <option value="Skirts">Skirts</option>
              <option value="Bags">Bags</option>
            </optgroup>
            <optgroup label="Kids">
              <option value="Kids T-Shirts">Kids T-Shirts</option>
              <option value="Kids Jeans">Kids Jeans</option>
              <option value="Kids Shoes">Kids Shoes</option>
              <option value="Kids Dresses">Kids Dresses</option>
            </optgroup>
            <optgroup label="General">
              <option value="Accessories">Accessories</option>
              <option value="Sports Bra">Sports Bra</option>
              <option value="Leggings">Leggings</option>
              <option value="Track Pants">Track Pants</option>
              <option value="Shorts">Shorts</option>
            </optgroup>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Description</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold"><i class="fas fa-images me-1"></i>Product Images (select multiple)</label>
          <input type="file" name="images" class="form-control" accept="image/*" multiple>
          <div class="form-text">First selected image becomes the cover image. You can also set a single cover below.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Cover Image</label>
          <input type="file" name="image" class="form-control" accept="image/*">
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Product</button>
        <a href="{% url 'product_data' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
