{% extends 'base.html' %}

{% block content %}
<div class="card mt-4">
  <div class="card-body">
    <h2 class="card-title">Payment Successful</h2>
    <p>Your payment was processed successfully.</p>
    {% if payment %}
      <p>Transaction ID: {{ payment.order_id }}</p>
      <p>Amount: {{ payment.amount }} {{ payment.currency }}</p>
    {% endif %}
    <a href="{% url 'customer_dashboard' %}" class="btn btn-primary">Return to dashboard</a>
  </div>
</div>
{% endblock %}
